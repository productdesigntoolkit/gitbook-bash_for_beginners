name: Build Multi-Format eBook (EPUB, PDF, MOBI)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-german calibre

      - name: Create EPUB Metadata
        run: |
          cat > metadata.yaml << EOF
          ---
          title: "Product Design Toolkit - ${{ github.event.repository.name }}"
          author: "Ralph Hutter"
          language: de-CH
          rights: "© $(date +%Y) Ralph Hutter. Alle Rechte vorbehalten."
          publisher: "HWZ Zürich / Product Design Toolkit"
          date: $(date +%Y-%m-%d)
          description: "Eine umfassende Anleitung für modernes Produktdesign und digitale Innovation."
          subject: "Product Design, Innovation, Digital Business"
          keywords: "Product Design, Toolkit, Innovation, Digital Strategy"
          ---
          EOF

      - name: Collect Markdown Files
        run: |
          if [ -f "SUMMARY.md" ]; then
            grep -oP '(?<=\()(.*?)(?=\))' SUMMARY.md | grep '\.md$' > files.txt
          else
            find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | sort > files.txt
          fi

          echo "📄 Gefundene Dateien:"
          cat files.txt

      - name: Build EPUB
        run: |
          FILES=$(cat files.txt | tr '\n' ' ')

          pandoc metadata.yaml $FILES \
            -o book.epub \
            --toc \
            --toc-depth=3 \
            --epub-chapter-level=2 \
            --css=styles/epub.css \
            --metadata lang=de-CH

          echo "✅ EPUB erstellt"
          ls -lh book.epub

      - name: Build PDF
        run: |
          FILES=$(cat files.txt | tr '\n' ' ')

          pandoc metadata.yaml $FILES \
            -o book.pdf \
            --toc \
            --toc-depth=3 \
            --pdf-engine=xelatex \
            -V geometry:margin=2.5cm \
            -V documentclass=book \
            -V papersize=a4 \
            -V fontsize=11pt \
            -V mainfont="DejaVu Serif" \
            -V sansfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono"

          echo "✅ PDF erstellt"
          ls -lh book.pdf

      - name: Build MOBI
        run: |
          ebook-convert book.epub book.mobi \
            --output-profile kindle \
            --language de \
            --authors "Ralph Hutter" \
            --publisher "HWZ Zürich / Product Design Toolkit"

          echo "✅ MOBI erstellt"
          ls -lh book.mobi

      - name: Create Summary
        run: |
          echo "📊 Build Summary" > build-summary.txt
          echo "================" >> build-summary.txt
          echo "" >> build-summary.txt
          echo "Repository: ${{ github.event.repository.name }}" >> build-summary.txt
          echo "Commit: ${{ github.sha }}" >> build-summary.txt
          echo "Datum: $(date +%Y-%m-%d\ %H:%M:%S)" >> build-summary.txt
          echo "" >> build-summary.txt
          echo "Generierte Dateien:" >> build-summary.txt
          ls -lh book.* >> build-summary.txt

          cat build-summary.txt

      - name: Upload All Formats as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebooks-${{ github.sha }}
          path: |
            book.epub
            book.pdf
            book.mobi
            build-summary.txt
          retention-days: 90

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            book.epub
            book.pdf
            book.mobi
          body: |
            📚 eBook Release

            Verfügbare Formate:
            - EPUB (Standard E-Reader)
            - PDF (Druck & Desktop)
            - MOBI (Kindle)

            Autor: Ralph Hutter
            Publisher: HWZ Zürich / Product Design Toolkit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
